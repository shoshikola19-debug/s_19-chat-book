# Render blueprint for S_19 CHAT BOOK (free tier)
# Deploy: push this repo to GitHub, then in Render Dashboard ->
# "New +" -> "Blueprint" -> pick the repo. Render reads this file.
services:
  - type: web
    name: s19-chat-book
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # SMS variables are optional. Leave them empty for test-code mode.
      # Set them in the Render Dashboard (Environment tab) when the
      # Bangladeshi SMS gateway account is ready — never commit keys.
      - key: SMS_PROVIDER
        value: ""
      - key: SMS_API_URL
        value: ""
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        value: ""
      # Email (Gmail login) variables are optional too. Leave them empty
      # for test-code mode; set them in the Dashboard when ready.
      # Recommended: EMAIL_PROVIDER=brevo with a Brevo API key (HTTPS,
      # works on Render free tier). Gmail SMTP does NOT work on Render
      # free tier — it blocks SMTP ports 25/465/587 (connection timeout,
      # not a wrong password); smtp is local-dev only. Resend free tier
      # without a verified domain only sends to its own account email.
      - key: EMAIL_PROVIDER
        value: ""
      - key: EMAIL_API_URL
        value: ""
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: ""
      - key: EMAIL_SMTP_HOST
        value: ""
      - key: EMAIL_SMTP_PORT
        value: ""
      - key: EMAIL_SMTP_SECURE
        value: ""
      - key: EMAIL_SMTP_USER
        value: ""
      - key: EMAIL_SMTP_PASS
        sync: false
      # Permanent database: set DATABASE_URL to the Neon Postgres
      # connection string (Dashboard -> Environment). When it is set the
      # app uses Neon and data survives restarts; when it is empty the
      # app falls back to a local SQLite file (lost on restart/redeploy
      # on the free tier, fine for testing only). The connection string
      # holds a password, so it is marked sync: false and must never be
      # committed. The code strips channel_binding=require automatically.
      - key: DATABASE_URL
        sync: false
      # Web Push notifications (calls/messages arrive even when the app
      # is closed). Both keys come from the VAPID key pair: the public
      # key is public, the private key is in .vapid-private-key.txt
      # (gitignored). Paste both in the Dashboard (Environment tab) —
      # never commit them. Empty = push disabled, app works as before.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Admin panel: who can see the Admin tab. Comma-separated phone
      # numbers in the app's stored form (e.g. 8801XXXXXXXXX, no +) or
      # Gmail addresses, e.g. 8801XXXXXXXXX,shoshikola19@gmail.com.
      # Empty = nobody is admin, the tab stays hidden for everyone.
      # Set this in the Dashboard (Environment tab) — it is not secret,
      # but it belongs with the other env vars, not in git.
      - key: ADMIN_USERS
        value: ""
    # Free tier has an ephemeral disk: the SQLite file is lost when the
    # service restarts or redeploys. Use DATABASE_URL (Neon, free tier)
    # for permanent data instead (see README.md).
